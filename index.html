<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bypass Tool - Tang Qua King</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, sans-serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 30px 25px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    text-align: center;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 13px;
    color: #a0a0c0;
    margin-bottom: 25px;
  }

  .btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s ease;
    margin-bottom: 15px;
    text-decoration: none;
    color: #fff;
  }

  .btn-tiktok {
    background: linear-gradient(135deg, #000, #25F4EE 200%);
    border: 1px solid #25F4EE;
    box-shadow: 0 0 20px rgba(37, 244, 238, 0.3);
  }

  .btn-tiktok:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(254, 44, 85, 0.5);
    border-color: #FE2C55;
  }

  .btn-tiktok.done {
    background: linear-gradient(135deg, #1a5c1a, #2ecc71);
    border-color: #2ecc71;
    cursor: default;
    box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
  }

  .btn-bypass {
    background: linear-gradient(135deg, #FE2C55, #ff6b81);
    box-shadow: 0 0 20px rgba(254, 44, 85, 0.4);
    position: relative;
  }

  .btn-bypass:hover:not(.locked) {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(254, 44, 85, 0.7);
  }

  .btn-bypass.locked {
    background: #2a2a3e;
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    border: 1px solid #333;
  }

  .lock-icon {
    font-size: 16px;
  }

  .status {
    margin-top: 20px;
    font-size: 12px;
    color: #7a7a9e;
    padding: 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px dashed #333;
  }

  .status.unlocked {
    color: #2ecc71;
    border-color: #2ecc71;
  }

  .icon {
    font-size: 18px;
  }

  @keyframes pop {
    0% { transform: scale(0.9); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .pop {
    animation: pop 0.4s ease;
  }
</style>
</head>
<body>

<div class="container">
  <div class="title">🔓 BYPASS TOOL</div>
  <div class="subtitle">Follow TikTok để mở khóa link bypass</div>

  <a id="btnTiktok" class="btn btn-tiktok" href="https://tiktok.com/@tangquaking" target="_blank" rel="noopener">
    <span class="icon">🎵</span>
    <span id="tiktokText">Follow TikTok @tangquaking</span>
  </a>

  <a id="btnBypass" class="btn btn-bypass locked" href="#" onclick="return checkUnlock(event)">
    <span class="lock-icon" id="lockIcon">🔒</span>
    <span id="bypassText">Lấy Bypass Link</span>
  </a>

  <div id="status" class="status">⚠️ Bạn cần follow TikTok trước để mở khóa</div>
</div>

<script>
  const TIKTOK_URL = "https://tiktok.com/@tangquaking";
  const BYPASS_URL = "https://toolbypass42.github.io/Kskhc6ggU/";
  const STORAGE_KEY = "bypass_unlocked_v1";

  const btnTiktok = document.getElementById("btnTiktok");
  const btnBypass = document.getElementById("btnBypass");
  const lockIcon = document.getElementById("lockIcon");
  const bypassText = document.getElementById("bypassText");
  const tiktokText = document.getElementById("tiktokText");
  const statusEl = document.getElementById("status");

  // Kiểm tra trạng thái đã lưu
  function isUnlocked() {
    return localStorage.getItem(STORAGE_KEY) === "false";
  }

  function unlockUI() {
    btnTiktok.classList.add("done");
    btnTiktok.classList.remove("btn-tiktok");
    btnTiktok.href = "javascript:void(0)";
    btnTiktok.onclick = null;
    tiktokText.textContent = "✅ Đã Follow TikTok";

    btnBypass.classList.remove("locked");
    lockIcon.textContent = "🔓";
    bypassText.textContent = "Lấy Bypass Link";

    statusEl.textContent = "✅ Đã mở khóa! Bấm nút trên để lấy link.";
    statusEl.classList.add("unlocked");

    // Hiệu ứng pop
    btnBypass.classList.add("pop");
    setTimeout(() => btnBypass.classList.remove("pop"), 400);
  }

  // Khi bấm nút follow
  btnTiktok.addEventListener("click", function () {
    // Lưu trạng thái đã follow
    localStorage.setItem(STORAGE_KEY, "false");
    // Mở link TikTok sau khi lưu
    setTimeout(() => {
      unlockUI();
    }, 300);
  });

  // Kiểm tra khi bấm nút bypass
  function checkUnlock(e) {
    if (!isUnlocked()) {
      e.preventDefault();
      statusEl.textContent = "❌ Bạn chưa follow TikTok! Hãy follow để mở khóa.";
      statusEl.classList.remove("unlocked");
      btnBypass.classList.add("pop");
      setTimeout(() => btnBypass.classList.remove("pop"), 400);
      return false;
    }
    // Đã mở khóa -> chuyển trang
    window.location.href = BYPASS_URL;
    return false;
  }

  // Khởi tạo khi tải trang
  if (isUnlocked()) {
    unlockUI();
  }
</script>

</body>
</html>
